[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datavault"
version = "0.1.0"
description = "A standard CLI tool for vectorized operations using NumPy on large datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

# This registers the entry point for terminal/CLI execution
[project.scripts]
datavault = "datavault.utils.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.coverage.run]
omit = [
    "datavault/example.py",
    "datavault/main.py",
    "datavault/utils/datavault.py",
    "datavault/exception/face.py",
    "datavault/exception/face2.py",
]